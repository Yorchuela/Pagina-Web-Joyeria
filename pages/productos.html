<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos - Joyeria Yorch</title>

    <!-- Estilos generales -->
    

    <!-- Estilos de productos -->
    <link rel="stylesheet" href="../css/productos.css">
</head>

<body>

    <h2>Gestión de Productos</h2>
    <button class="btn-regresar" onclick="
    window.location.href=
    '../index.html'
    ">

        ⬅ Regresar

    </button>
    <!--Agregar un producto-->
    <table border="1">
        <div class="acciones-superior">

            <button class="btn-agregar" onclick="irAgregarProducto()">

                ➕ Agregar Producto

            </button>

        </div>
    </table>


    <!-- BUSCADOR -->
    <input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscarProductos()">

    <hr>

        <nav id="menu"></nav>

        <div class="user" id="rolUsuario"></div>

        <button id="btnLogin" onclick="irLogin()">
            Iniciar sesión
        </button>

        <button id="btnLogout" onclick="logout()" style="display:none;">
            Cerrar sesión
        </button>
    </header>

    <!-- CONTENIDO -->
    <main class="productos-container">

        <h2>Gestión de Productos</h2>

        <div class="acciones-superior">
            <button class="btn-agregar" onclick="irAgregarProducto()">
                ➕ Agregar Producto
            </button>
        </div>

        <!-- BUSCADOR -->
        <input
            type="text"
            id="buscador"
            placeholder="Buscar producto..."
            onkeyup="buscarProductos()"
        >

        <hr>

        <!-- TABLA -->
        <table>

            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Serie</th>
                    <th>Certificado</th>
                    <th>Kilataje</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaProductos"></tbody>

        </table>

    </main>

    <script src="../js/script.js"></script>
    <script src="../js/productos.js"></script>
    <script src="../js/protect.js"></script>

</body>
</html>
