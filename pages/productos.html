<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="../css/productos.css">
</head>

<body>

    <h2>Gestión de Productos</h2>
     <a class="btn-regresar"
    href="javascript:history.back()"
    class="btn-volver"
>

    ← Regresar

</a>
    <!--Agregar un producto-->
    <table border="1">
        <div class="acciones-superior">

            <button class="btn-agregar" onclick="irAgregarProducto()">

                ➕ Agregar Producto

            </button>

        </div>
    </table>


    <!-- BUSCADOR -->
    <input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscarProductos()">

    <hr>

    <!-- TABLA -->
    <table border="1">
        <thead>

            <tr>

                <th>Imagen</th>

                <th>Producto</th>

                <th>Descripción</th>

                <th>Categoría</th>

                <th>Serie</th>

                <th>Certificado</th>

                <th>Kilataje</th>

                <th>Precio</th>

                <th>Estado</th>

                <th>Fecha</th>

                <th>Acciones</th>

            </tr>

        </thead>
        <tbody id="tablaProductos"></tbody>
    </table>

    <script src="../js/productos.js"></script>

</body>
<script src="../js/protect.js"></script>

</html>
