<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Gestión de Productos</h2>

<!-- BUSCADOR -->
<input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="buscarProductos()">

<!-- FORMULARIO -->
<form onsubmit="guardarProducto(event)">
    <input type="hidden" id="editIndex">

    <input type="text" id="nombre" placeholder="Nombre del producto" required>
    <input type="text" id="categoria" placeholder="Categoría (Anillo, Pulsera...)" required>
    <input type="number" id="precio" placeholder="Precio" required>
    <input type="number" id="stock" placeholder="Stock" required>

    <button type="submit">Guardar Producto</button>
</form>

<hr>

<!-- TABLA -->
<table border="1">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
</table>

<script src="productos.js"></script>

</body>
<script src="../js/auth.js"></script>
<script>
verificarRol(["admin", "almacen"]);
</script>
</html>
