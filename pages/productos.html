<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="../css/productos.css">
</head>

<body>

    <h2>Gestión de Productos</h2>

    <button 
    type="button"
    class="btn-regresar"
    onclick="history.back()"
>

    ← Regresar

</button>

<button 
    type="button"
    class="btn-inicio"
    onclick="window.location.href='../index.html'"
>

    🏠 Ir al Inicio

</button>
     



    <!--Agregar un producto-->
    <table border="1">
        <div class="acciones-superior">

            <button class="btn-agregar" onclick="irAgregarProducto()">
                    ➕ Agregar Producto
                </button>

        </div>

    </div>

        <!-- TABLA -->
        <table border="1">
            <thead>

                <tr>

                    <th>ID</th>

                    <th>Imagen</th>

                    <th>Producto</th>

                    <th>Precio</th>

                    <th>Estado</th>

                    <th>Acciones</th>

                </tr>

        </thead>
        <tbody id="tablaProductos"></tbody>
    </table>

    <script src="../js/productos.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- MODAL DETALLES PRODUCTO -->

    <div class="modal-detalle" id="modalDetalle">

        <div class="modal-detalle-contenido">

            <button class="cerrar-modal" onclick="cerrarModalDetalle()">

                ✖

            </button>

            <div class="detalle-grid">

                <!-- IMAGEN -->

                <div class="detalle-imagen">

                    <img id="detalleImagen">

                </div>

                <!-- INFORMACION -->

                <div class="detalle-info">

                    <h2 id="detalleNombre">

                    </h2>

                    <p>

                        <strong>ID:</strong>

                        <span id="detalleID">

                        </span>

                    </p>

                    <p>

                        <strong>Descripción:</strong>

                        <span id="detalleDescripcion">

                        </span>

                    </p>

                    <p>

                        <strong>Categoría:</strong>

                        <span id="detalleCategoria">

                        </span>

                    </p>

                    <p>

                        <strong>Serie:</strong>

                        <span id="detalleSerie">

                        </span>

                    </p>

                    <p>

                        <strong>Certificado:</strong>

                        <span id="detalleCertificado">

                        </span>

                    </p>

                    <p>

                        <strong>Kilataje:</strong>

                        <span id="detalleKilataje">

                        </span>

                    </p>

                    <p>

                        <strong>Precio:</strong>

                        <span id="detallePrecio">

                        </span>

                    </p>

                    <p>

                        <strong>Estado:</strong>

                        <span id="detalleEstado">

                        </span>

                    </p>

                    <p>

                        <strong>Fecha:</strong>

                        <span id="detalleFecha">

                        </span>

                    </p>

                </div>

            </div>

        </div>

    </div>
</body>
<script src="../js/protect.js"></script>

</html>
