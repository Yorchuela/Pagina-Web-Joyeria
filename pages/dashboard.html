    <!-- LIBRERÍAS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

    <!-- CONTENEDOR -->

    <div class="container" id="dashboard">

        <h2>

            Dashboard General

        </h2>

        <!-- TARJETAS -->

        <div class="cards">

            <div class="card">

                <h3>

                    💰 Ventas del Día

                </h3>

                <p id="ventasHoy">

                    $0

                </p>

            </div>

            <div class="card">

                <h3>

                    📦 Stock Bajo

                </h3>

                <p id="stockBajo">

                    0

                </p>

            </div>

            <div class="card">

                <h3>

                    🔄 Devoluciones Hoy

                </h3>

                <p id="devolucionesHoy">

                    0

                </p>

            </div>

            <div class="card">

                <h3>

                    📊 Total en Caja

                </h3>

                <p id="totalCaja">

                    $0

                </p>

            </div>

        </div>

        <!-- GRÁFICAS -->

        <h3>

            📈 Ventas por Día

        </h3>

        <canvas id="graficaVentas"></canvas>

        <h3>

            📦 Productos Más Vendidos

        </h3>

        <canvas id="graficaProductos"></canvas>

        <h3>

            🔄 Devoluciones por Día

        </h3>

        <canvas id="graficaDevoluciones"></canvas>

        <h3>

            💰 Ingresos vs Egresos

        </h3>

        <canvas id="graficaCaja"></canvas>

        <!-- TABLA -->

        <h3>

            ⚠ Productos con bajo stock

        </h3>

        <table>

            <thead>

                <tr>

                    <th>

                        Producto

                    </th>

                    <th>

                        Stock

                    </th>

                </tr>

            </thead>

            <tbody id="tablaStock"></tbody>

        </table>

        <!-- BOTÓN PDF -->

        <button onclick="exportarPDF()">

            Exportar a PDF

        </button>

    </div>

    <!-- JS -->

    <script src="../js/dashboard.js"></script>

    <script src="../js/protect.js"></script>
