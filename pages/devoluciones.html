<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/devoluciones.css">
</head>

<body>

    <button class="btn-regresar" onclick="history.back()">
    ← Regresar
</button>

    <div class="container">
        <h2>Devoluciones</h2>
        <p>

            Procesa devoluciones de productos vendidos.

        </p>

        <label>Seleccionar Venta</label>
        <select id="ventaSelect"></select>

        <label>Producto</label>
        <select id="productoDevolucion"></select>
        <label>Motivo de devolución</label>

        <textarea id="motivo" placeholder="Escribe el motivo"></textarea>

        <button onclick="realizarDevolucion()">Procesar Devolución</button>

        <h3>Historial de Devoluciones</h3>
        <table>
            <thead>
                <tr>
                    <th>Venta</th>
                    <th>Producto</th>
                    <th>Vendedor</th>
                    <th>Motivo</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody id="tablaDevoluciones"></tbody>
        </table>
    </div>

</body>

<script src="../js/devoluciones.js"></script>

<script src="../js/protect.js"></script>

</html>
