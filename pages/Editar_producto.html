<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>

        Editar Producto

    </title>

    <link rel="stylesheet" href="../css/agregar_producto.css">

</head>

<body>

<div class="container">
     <button
            type="button"
            class="btn-volver"
            onclick="volver()"
        >

            ⬅ Volver

        </button>

    <div class="form-box">

        <h2>

            ✏️Editar Producto

        </h2>

        <form id="formEditarProducto">

    <!-- FILA 1 -->

    <div class="fila">

        <div class="campo">

            <label>
                Nombre Producto
            </label>

            <input
                type="text"
                id="nombre"
                required
            >

        </div>

        <div class="campo">

            <label>
                Categoría
            </label>

            <select id="categoria" required>

                <option value="">
                    Seleccionar categoría
                </option>

            </select>

        </div>

    </div>

    <!-- FILA 2 -->

    <div class="campo campo-grande">

        <label>
            Descripción
        </label>

        <textarea id="descripcion"></textarea>

    </div>

    <!-- FILA 3 -->

    <div class="fila">

        <div class="campo">

            <label>
                Serie Única
            </label>

            <input
                type="text"
                id="serie"
                required
            >

        </div>

        <div class="campo">

            <label>
                Certificado
            </label>

            <input
                type="text"
                id="certificado"
            >

        </div>

    </div>

    <!-- FILA 4 -->

    <div class="fila">

        <div class="campo">

            <label>
                Kilataje
            </label>

            <select id="kilataje">

                <option value="">
                    Seleccionar
                </option>

                <option value="10">
                    10K
                </option>

                <option value="14">
                    14K
                </option>

                <option value="18">
                    18K
                </option>

                <option value="24">
                    24K
                </option>

            </select>

        </div>

        <div class="campo">

            <label>
                Precio
            </label>

            <input
                type="number"
                step="0.01"
                id="precio"
                required
            >

        </div>

    </div>

    <!-- FILA 5 -->

    <div class="fila">

        <div class="campo">

            <label>
                Imagen Producto
            </label>

            <input
                type="file"
                id="ruta_imagen"
                accept="image/*"
            >

        </div>

        <div class="campo">

            <label>
                Estado Producto
            </label>

            <select id="estado_producto">

                <option value="Disponible">
                    Disponible
                </option>

                <option value="Apartado">
                    Apartado
                </option>

                <option value="Vendido">
                    Vendido
                </option>

            </select>

        </div>

    </div>

    <!-- BOTONES -->

    <div class="botones">

        <button type="submit">

            💾 Actualizar Producto

        </button>

       

    </div>

</form>

    </div>

</div>

<script src="../js/editar_producto.js"></script>
</body>


</html>
