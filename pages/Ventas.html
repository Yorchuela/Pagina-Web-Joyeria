<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>

        Ventas

    </title>

    <link rel="stylesheet" href="../css/ventas.css">

</head>

<body>

    <div class="container">

        <h2>

            💰 Registro de Venta

        </h2>

        <!-- PRODUCTO -->

        <label>

            Producto

        </label>

        <select id="producto">

        </select>

        <button onclick="agregarAlCarrito()">

            ➕ Agregar

        </button>
        <!-- CLIENTE -->

        <label>

            Cliente

        </label>

        <select id="cliente">

            <option value="">

                Venta rápida

            </option>

        </select>

        <!-- TABLA -->

        <h3>

            Carrito de Venta

        </h3>

        <table>

            <thead>

                <tr>

                    <th>
                        Producto
                    </th>

                    <th>
                        Precio
                    </th>

                    <th>
                        Subtotal
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>

            <tbody id="carritoTabla">

            </tbody>

        </table>

        <!-- PAGO -->

        <label>

            Método de pago

        </label>

        <select id="pago">

            <option value="Efectivo">

                Efectivo

            </option>

            <option value="Tarjeta">

                Tarjeta

            </option>

        </select>

        <!-- TOTAL -->

        <h2>

            Total:

            $

            <span id="total">

                0

            </span>

        </h2>

        <!-- BOTÓN -->

        <button class="btn-finalizar" onclick="finalizarVenta()">

            Finalizar Venta

        </button>

    </div>

    <script src="../js/ventas.js"></script>

    <script src="../js/protect.js"></script>

    <script>

        protegerPagina([
            "Administrador",
            "Vendedor"
        ]);

    </script>

</body>

</html>
