<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas</title>

<link rel="stylesheet" href="../css/ventas.css">
</head>

<body>

<div class="container">

    <h2>Nueva Venta</h2>

    <!-- PRODUCTO -->
    <label>Producto</label>
    <select id="producto">
        <option value="" disabled selected>Seleccione un producto</option>
    </select>

    <!-- CANTIDAD -->
    <label>Cantidad</label>
    <input type="number" id="cantidad" min="1" value="1">

    <button type="button" onclick="agregarCarrito()">
        Agregar al carrito
    </button>

    <hr>

    <!-- CARRITO -->
    <h3>Carrito</h3>

    <table>

        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaCarrito"></tbody>

    </table>

    <hr>

    <!-- DESCUENTO -->
    <label>Descuento (%)</label>
    <input
        type="number"
        id="descuento"
        min="0"
        max="100"
        value="0"
        oninput="calcularTotal()"
    >

    <!-- MÉTODO DE PAGO -->
    <label>Método de pago</label>

    <select id="metodoPago">
        <option>Efectivo</option>
        <option>Tarjeta</option>
        <option>Transferencia</option>
    </select>

    <div class="totales">

        <h3 id="subtotal">
            Subtotal: $0
        </h3>

        <h2 id="total">
            Total: $0
        </h2>

    </div>

    <button type="button" onclick="registrarVenta()">
        Finalizar Venta
    </button>

</div>

<script src="../js/ventas.js"></script>

<script src="../js/auth.js"></script>
<script>
verificarRol(["admin","cajero"]);
</script>

</body>
</html>
