<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Historial de Compras
    </title>

    <link rel="stylesheet" href="../css/historial_cliente.css">

</head>

<body>

    <!-- BOTONES -->

    <div class="top-buttons">

        <button class="btn-volver" onclick="window.history.back()">

            ⬅ Regresar

        </button>

        <button class="btn-inicio" onclick="window.location.href='../index.html'">

            🏠 Inicio

        </button>

    </div>

    <!-- CONTENEDOR -->

    <div class="container">

        <h2>
            🧾 Mi Historial de Compras
        </h2>

        <!-- RESUMEN -->

        <div class="resumen">

            <div class="card-resumen">

                <span>
                    🛍
                </span>

                <h3 id="totalCompras">
                    0
                </h3>

                <p>
                    Compras realizadas
                </p>

            </div>

            <div class="card-resumen">

                <span>
                    💰
                </span>

                <h3 id="totalGastado">
                    $0
                </h3>

                <p>
                    Total gastado
                </p>

            </div>

            <div class="card-resumen">

                <span>
                    📦
                </span>

                <h3 id="productosComprados">
                    0
                </h3>

                <p>
                    Productos comprados
                </p>

            </div>

        </div>

        <!-- BUSCADOR -->

        <div class="buscador-container">

            <input type="text" id="buscador" placeholder="🔍 Buscar producto...">

        </div>

        <!-- TABLA -->

        <table>

            <thead>

                <tr>


                    <th>
                        📅 Fecha
                    </th>

                    <th>
                        💎 Producto
                    </th>

                    <th>
                        📦 Cantidad
                    </th>

            

                    <th>
                        💰 Total
                    </th>

                </tr>

            </thead>

            <tbody id="tablaHistorial">


            </tbody>

        </table>

    </div>

</body>

<script src="../js/auth.js"></script>

<script>

    verificarRol([
        "Administrador",
        "Cliente"
    ]);

</script>

<script src="../js/historial.js"></script>

</html>
