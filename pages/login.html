<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Joyeria</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
<div class="login-box">
    <h2>Iniciar Sesión</h2>

    <form onsubmit="login(event)">
        
        <label>Correo Electronico</label>
        <input type="email" id="correo" placeholder="example@gmail.com" required>

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>

        <p onclick="recuperarPassword()" style="cursor:pointer;color:blue;"> 
            ¿Olvidaste tu contraseña?</p>

        <button type="submit">Entrar</button>
    </form>

    <!-- NUEVO APARTADO -->
    <div class="extra">
        <p>¿No tienes cuenta?</p>
        <a href="Altas.html" class="crear-cuenta">Crear cuenta</a>
    </div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
