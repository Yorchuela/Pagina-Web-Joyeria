<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Login Joyeria
    </title>

    <link rel="stylesheet"
          href="../css/login.css">

</head>

<body>

    <!-- LOGIN -->

    <div class="login-box">

        <h2>
            Iniciar Sesión
        </h2>

        <form onsubmit="login(event)">

            <!-- CORREO -->

            <label for="correo">
                Correo Electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="example@gmail.com"
                required
            >

            <!-- PASSWORD -->

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                required
            >

            <!-- RECUPERAR PASSWORD -->

            <a
                href="#"
                class="link-password"
                onclick="recuperarPassword()"
            >

                ¿Olvidaste tu contraseña?

            </a>

            <!-- BOTON LOGIN -->

            <button type="submit">

                Ingresar

            </button>

        </form>

        <!-- CREAR CUENTA -->

        <div class="extra">

            <p>
                ¿No tienes cuenta?
            </p>

            <a
                href="Altas.html"
                class="crear-cuenta"
            >

                Crear cuenta

            </a>

        </div>

    </div>

    <!-- JS -->

    <script src="../js/auth.js"></script>

</body>

</html>
