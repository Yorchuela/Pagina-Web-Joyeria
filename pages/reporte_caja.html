<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Reporte de Caja

    </title>

    <link rel="stylesheet" href="../css/reportes.css">

</head>

<body>

    <!-- BOTON -->

    <a href="javascript:history.back()" class="btn-volver">

        ← Regresar

    </a>


    <div class="container">

        <h2>

            Reporte de Caja

        </h2>

        <!-- TOP -->

        <div class="top-inventario">

            <!-- BOTONES -->

            <div class="acciones-reportes">

                <button class="btn-excel" onclick="exportarExcel()">

                    📗 Exportar Excel

                </button>

                <button class="btn-pdf" onclick="exportarPDF()">

                    📕 Exportar PDF

                </button>

            </div>

            <!-- CARDS -->

            <div class="cards-inventario">

                <!-- INGRESOS -->

                <div class="card-resumen">

                    <div class="icono-card">

                        💵

                    </div>

                    <div>

                        <p>

                            Ingresos

                        </p>

                        <h3 id="cardIngresos">

                            $0

                        </h3>

                    </div>

                </div>

                <!-- EGRESOS -->

                <div class="card-resumen">

                    <div class="icono-card">

                        🔄

                    </div>

                    <div>

                        <p>

                            Egresos

                        </p>

                        <h3 id="cardEgresos">

                            $0

                        </h3>

                    </div>

                </div>

                <!-- GANANCIA -->

                <div class="card-resumen">

                    <div class="icono-card">

                        💰

                    </div>

                    <div>

                        <p>

                            Ganancia

                        </p>

                        <h3 id="cardGanancia">

                            $0

                        </h3>

                    </div>

                </div>

            </div>

        </div>

        <!-- FILTROS -->

        <div class="panel-filtros">

            <select id="tipoReporte">

                <option value="diario">

                    📅 Diario

                </option>

                <option value="semanal">

                    🗓 Semanal

                </option>

                <option value="mensual">

                    📆 Mensual

                </option>

                <option value="anual">

                    🧾 Anual

                </option>

                <option value="personalizado">

                    ⚙ Personalizado

                </option>

            </select>

            <input type="date" id="fechaInicio">

            <!-- FECHA FINAL -->

            <input type="date" id="fechaFin">

            <!-- MES -->

            <input type="month" id="mesInput">

            <!-- AÑO -->

            <input type="number" id="anioInput" min="2020" max="2100" placeholder="Año">

            <button onclick="filtrarCaja()">

                🔍 Filtrar

            </button>

            <button class="btn-limpiar" onclick="limpiarFiltros()">

                ✖ Limpiar

            </button>

        </div>

        <!-- TABLA -->

        <table>

            <thead>

                <tr>

                    <th>

                        Fecha

                    </th>

                    <th>

                        Ventas

                    </th>

                    <th>

                        Efectivo

                    </th>

                    <th>

                        Tarjeta

                    </th>

                    <th>

                        Egresos

                    </th>

                    <th>

                        Ganancia

                    </th>

                </tr>

            </thead>

            <tbody id="tablaCaja">

            </tbody>

        </table>


    </div>



    <!-- LIBRERIAS -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script src="../js/reporte_caja.js"></script>
    <script src="../js/protect.js"></script>


</body>

</html>
